  notes: >
    Real repository at the commit swe-bump-bench recorded; the bump to the exact
    published axe-core 4.13.0 (manifest and regenerated lockfile) is the case's
    public start patch. The project's own mocha suite drives a real Chromium
    through Puppeteer, which `--ignore-scripts` never downloads, so it is not a
    check here; the TypeScript build is.

    axe-core 4 turned the analysis context into a union — a bare selector, or an
    object carrying at least one of `include`/`exclude` — so the project's
    `const ctx: Axe.ElementContext = {}` followed by conditional assignment
    fails with three errors in its own source.

    The build is a weak judge of the fix. Typing that object `any`, casting it,
    or keeping only one of the two branches all compile, and all change which
    part of the page an accessibility scan covers — a scan that silently widens
    to the whole document reports the wrong violations and never fails. The
    hidden test drives the compiled class against a stub frame and reads back
    the context handed to the axe run.
