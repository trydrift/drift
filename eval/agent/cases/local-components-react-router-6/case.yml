  notes: >
    The large upgrade the rest of the suite does not have. Its median case has
    two impact sites, which is where a localization tool has least to offer;
    this one fails with fifteen errors across three files, and the migration
    touches a fourth (a `withRouter` shim the v6 guide describes, since the
    components are classes and v6 exposes the router through hooks).

    react-router-dom 6 removed `Switch`, `Redirect`, `withRouter` and
    `RouteComponentProps`, made `<Route>` take an `element`, resolves a child
    route's path against its parent rather than by hand-prefixing `match.url`,
    and replaced `NavLink`'s `exact`/`activeClassName` with `end` and a
    `className` callback.

    `--skipLibCheck` is the project's own posture (its `@types/jsdom` does not
    parse against its TypeScript), and without it the typecheck fails at the
    start state for a reason that has nothing to do with this upgrade. The
    project's 154 jest tests pass before and after, including under the broken
    start state, so they are a regression guard here rather than the thing that
    catches the upgrade.

    Every compile error can be made to go away by deleting the prop that will
    not typecheck. Dropping `activeClassName` compiles with zero errors and
    silently stops highlighting the navigation item for the current page, which
    is what the hidden test is for.
