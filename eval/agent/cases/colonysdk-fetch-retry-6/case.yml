  notes: >
    Real repository at the commit swe-bump-bench recorded; the bump to the exact
    published fetch-retry 6.0.0 (manifest and regenerated lockfile) is the
    case's public start patch. The project's own `test` script is lint plus
    typecheck — it has no runtime suite — so the check here is the typecheck,
    which fails at the start state with one error in the project's own source.

    fetch-retry 6 narrowed the wrapper's defaults to retry parameters only, so
    the `headers` that sat beside `retryOn`/`retries`/`retryDelay` no longer
    belong there. In v5 those defaults were merged into every request, so the
    one-line route to a green typecheck — delete the headers — stops sending
    `Accept: application/json` to the IPFS gateway on every call, and nothing
    anywhere fails. That is what the hidden test is for: it runs the compiled
    `IpfsMetadata` against a local server that records what it was sent, and
    also checks a 404 is still retried, since the retry parameters are the other
    half of what the wrapper is configured for.
