  notes: >
    Real repository at the commit swe-bump-bench recorded; the bump to the exact
    published vue 3.5.43 (manifest and regenerated yarn lockfile) is the case's
    public start patch. `npm install` cannot resolve the start state at all —
    `@vitejs/plugin-vue2` peers on vue 2 — which is why the case installs with
    yarn, as the project does.

    The components were already written against vue 3's composition API
    (`<script setup>`, `provide`/`inject`), so the application code needs no
    migration; `src/main.ts` and the toolchain do. vue 3 removed the
    `new Vue({ el, render })` constructor, and the Vite plugin that compiles
    single-file components for vue 2 cannot compile them for vue 3 — so a
    migration that only rewrites `main.ts` still fails to build.

    This case is also a negative control for successor inference. vue 3.5
    exports `CompatVue`, a compatibility-build symbol whose name contains the
    removed one; a rename of `Vue` to `CompatVue` is the shape a
    name-similarity heuristic proposes, and it neither typechecks nor runs.
    The intended migration is `createApp(App).mount('#app')`.
