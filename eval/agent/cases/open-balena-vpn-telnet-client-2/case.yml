  notes: >
    Real repository at the commit swe-bump-bench recorded; the bump to the exact
    published telnet-client 2.2.14 (manifest and regenerated lockfile) is the
    case's public start patch. The project's own `test` script builds a Docker
    image, so it is not a check here; the TypeScript build is.

    telnet-client 2 publishes named exports, which breaks the deliberate
    `require('telnet-client') as typeof import('telnet-client').default` this
    file used to get past the 1.x typings' `export =`/`export default`
    mismatch — and a second error follows from it, an implicitly-typed `data`
    parameter on the connector's event handler.

    Casting to `any`, or keeping the require and widening the type, both
    compile and leave the connector constructed from something that is no longer
    the client class. The service then stops seeing OpenVPN's client
    connect/disconnect events with nothing failing anywhere, which is why the
    hidden test runs the compiled VpnManager against a TCP server standing in
    for the management interface: it connects for real, sends a command, and the
    log and client lines written back have to come out as parsed events.

    The module reads its configuration from the environment at import time, so
    the hidden test supplies the variables the config module requires.
