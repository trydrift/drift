  notes: >
    Real repository at the commit swe-bump-bench recorded; the bump to the exact
    published tar 7.5.22 (manifest and regenerated pnpm lockfile) is the case's
    public start patch. The project has no test script, so the only project
    check is the TypeScript build.

    Two errors, and they are different kinds. tar 7 removed the default export,
    so `import tar from 'tar'` fails in the project's own source. tar 7 also
    pulls minizlib 3, whose declarations reference `zlib.ZstdCompress` — absent
    from the `@types/node` 20 the project pins — so the build also fails inside
    `node_modules`. A complete migration handles both; the reference fix bumps
    `@types/node` to 22.

    The build is not the whole upgrade. `extract` still takes `file`, `cwd` and
    `strip`, and a migration that drops `strip: 1` while chasing a green build
    unpacks every docset one directory too deep — Zeal then finds nothing where
    it was told a docset would be, silently. The hidden test drives the compiled
    `extractDocset` against a real gzipped tarball for that reason.
