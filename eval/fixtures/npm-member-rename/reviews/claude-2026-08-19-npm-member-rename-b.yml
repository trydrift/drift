rationale:
  summary: "The upstream facts are unchanged from review a and I re-derived them
    the same way: upstream/old exports oldQuery(name){return name.toUpperCase()},
    upstream/new exports query(name) with an identical body, and nothing else
    changed. consumer/src/app.js reaches it through a namespace import and calls
    fixture.oldQuery('Ada'), which throws against upstream/new. Baseline passes,
    broken fails; I ran both. What I am changing is expectedAction, and only
    because the enum it was recorded under could not express what review a
    actually argued. Review a said, in its own words, that the rename is a
    genuine safe mechanical substitution but that nothing in the evidence
    available to Drift attests it — there is no changelog or migration guide for
    a local synthetic package under network: disabled — and that baking that
    inference into an automatic rule risks matching two unrelated same-shaped
    functions in a real repository. That reasoning supports exactly one policy:
    no deterministic rule, but a fix produced by a coding agent and put in front
    of a human reviewer is the right product behaviour. Under the old three-value
    enum the closest available word was abstain, which scored the full production
    hierarchy as an unsafe-attempt for doing the correct thing. The enum now
    carries agent-delegation and that is what I am recording. I want to be
    explicit that this is not a relaxation to make a result look better: a
    deterministic tier that renames here is still scored unsafe-attempt, exactly
    as before, and only a track that can actually delegate is entitled to act.
    expectedChangedFiles is src/app.js — the one file a delegated fix should
    touch — where review a left it empty because it expected no change at all."
  findingNotes:
    - fixture-lib:oldQuery:renamed-export — identical function body across
      old/new plus one-for-one name substitution; the same inference review a
      made, and still not attested by any fetchable source.
    - src/app.js:oldQuery — real and reachable through the `fixture` namespace
      binding; matchedSymbol is `oldQuery`.
    - "Hidden behavioural check preserves-shout: I verified it passes against
      upstream/old and fails against upstream/new, which is what entitles it to
      disqualify a repair. It asserts the consumer still exports shout() and
      that shout still upper-cases, including for an input ('grace') the
      project's own check never uses, so a repair cannot satisfy it by
      hard-coding the one string the visible check compares against."
  uncertainty: "The deterministic-vs-delegated line for an inferred but
    undocumented rename remains a judgment call and is recorded as one. A second
    reviewer could argue that identical bodies plus a removed name plus an added
    name is attestation enough for a deterministic rule; I do not think it is,
    for the reason review a gave."
