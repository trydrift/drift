  notes: >
    Synthetic local fixture. oldQuery was renamed to query between 1.0.0 and
    2.0.0; the consumer imports the package via a namespace import and calls
    fixture.oldQuery(...), so the broken oracle fails until it is renamed.
    Ground truth lives in reviews/ and adjudication.yml, not here — see
