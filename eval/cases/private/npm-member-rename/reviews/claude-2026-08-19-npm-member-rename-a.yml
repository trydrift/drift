rationale:
  summary: "upstream/old/index.js exports oldQuery(name){return
    name.toUpperCase()}; upstream/new/index.js exports query(name) with an
    identical body — the same rename pattern as npm-renamed-export, just
    accessed through a namespace import (import * as fixture from 'fixture-lib';
    fixture.oldQuery(...)) rather than a named one. consumer/src/app.js calls
    fixture.oldQuery('Ada'); against upstream/new this throws (fixture.oldQuery
    is not a function). Baseline passes, broken fails — confirmed by running
    both oracles. The underlying fact is a genuine, safe, mechanical rename
    (fixture.oldQuery -> fixture.query), same as the other fixture. But I am
    scoring expectedAction as abstain, not repair, for a specific reason:
    without a migration guide or changelog stating the rename (which this
    fixture deliberately provides no fetchable source for, since it is a local
    synthetic package under network: disabled), nothing in the evidence
    available to Drift links oldQuery to query except my own reading of both
    implementations side by side. A repair tool that renames call sites based on
    that same “identical body” inference risks matching two unrelated
    same-shaped functions in a real, non-synthetic scenario. I am treating that
    inference as sound for MY review (I have full access to both trees and can
    compare bodies), but not safe to bake into automatic repair without a stated
    source. This is a genuine judgment call, not a hedge to make scoring easier
    — a second reviewer could reasonably disagree."
  findingNotes:
    - fixture-lib:oldQuery:renamed-export — same identical-body rename pattern
      as npm-renamed-export.
    - src/app.js:oldQuery — real, reachable via a namespace import;
      matchedSymbol is `oldQuery` on the `fixture` namespace binding.
  uncertainty: The safe-repair-vs-abstain line for an inferred (not documented)
