rationale:
  summary: "upstream/old exports oldQuery(name){return name.toUpperCase()};
    upstream/new exports query(name) with an identical body and no other
    export changed. Unlike every other fixture in this corpus, the rename is
    *documented*: evidence/CHANGELOG.md's 2.0.0 section states, in the upstream
    project's own words, that oldQuery has been renamed to query and that the
    behaviour is unchanged. consumer/src/app.js reaches the symbol through a
    namespace import and calls fixture.oldQuery('Ada'); baseline passes, broken
    fails with a TypeError, and the gold patch makes it pass again. I ran all
    three. Because the replacement name is attested by a document a reviewer
    can open, a mechanical rule (rename the member oldQuery to query) is
    derivable from evidence rather than inferred from body shapes, which is
    exactly the line I drew on npm-member-rename when I recorded that one as
    agent-delegation. So this one is deterministic-repair. I want the contrast
    to be explicit, because it is the reason the fixture exists: the two cases
    differ in the evidence and in nothing else, and any tool that treats them
    identically is either guessing on one or refusing on the other."
  findingNotes:
    - "fixture-lib:export-removed:oldQuery — the evidence-layer fact, from the
      computed .d.ts surface diff. This is the D1 expectation; I am stating it
      because for once a synthetic case has a retrievable prose source and the
      level is genuinely reviewable."
    - "fixture-lib:oldQuery:removed-export and fixture-lib:oldQuery:renamed-export
      — two interpretations from two independent sources (the surface diff can
      only establish that the export is gone; the changelog establishes what
      replaced it). Both are correct and I am crediting both, on the same
      reasoning review c of npm-return-value used: a repository with types but
      no reachable changelog would legitimately produce only the first, and
      collapsing them would make that difference invisible."
    - "src/app.js:oldQuery — one real call site, reached through the `fixture`
      namespace binding."
    - "Hidden behavioural check preserves-shout: verified to pass against
      upstream/old, fail against upstream/new, and pass again with the gold
      patch applied."
  uncertainty: "None on the facts. One thing I want on the record: I expect
    Drift's built-in codemod tier to decline this case, because its single rule
    renames bare identifiers and this call site is a member after a dot. That
    would be a `missed-opportunity` against this expectedAction, and it is a
    real product limitation rather than a review error — it is the kind of gap
    a per-mechanism benchmark exists to make visible, and I am deliberately not
    softening the expectation to hide it."
