rationale:
  summary: "upstream/old/index.js: formatUser(user){return
    user.name.toUpperCase()} returns a string. upstream/new/index.js:
    formatUser(user){return {label: user.name.toUpperCase()}} returns an object.
    Both the .d.ts (string -> FormattedUser) and the runtime behaviour changed
    identically — this is a genuine return-shape breaking change, not just a
    type annotation change. consumer/src/app.js calls formatUser({name:'Ada'})
    and compares the result directly to the string 'ADA'; against upstream/new
    this comparison is false (an object !== a string) and the script throws.
    consumer/src/app.ts separately declares `export const label =
    formatUser({name:'Ada'})` and does nothing else with it — it type-checks
    against either shape (it is just an assignment with no property access), so
    it is not actually broken by this change in a way that fails at runtime, but
    it IS a real reference to the changed symbol, so it belongs in impactSites
    as a site that must be reviewed even though its own oracle (there is none
    for .ts — only src/app.js is the npm test entry point) would not catch a
    regression there. Baseline passes; broken fails (confirmed by running
    both)."
  findingNotes:
    - "fixture-lib:formatUser:return-value — return type changed from string to
      { label: string }, confirmed both structurally (.d.ts) and behaviourally
      (implementation)."
    - src/app.js:formatUser — real impact; the only oracle-covered call site,
      and the one that actually fails.
    - src/app.ts:formatUser — real reference to the changed symbol, but not
      exercised by any oracle in this fixture; flagged so a repair tool does not
      silently skip it just because nothing currently tests it.
  uncertainty: expectedAction is abstain because the correct fix for src/app.js
    depends on what the caller actually wants from the new object (here,
    .label), which is a judgment about intent, not a mechanical rename — there
    is no deterministic codemod tier for a return-shape change in production
    Drift, and generating one would require model-authored fix-plan tier 2c,
    which this benchmark deliberately keeps out of deterministic CI. Whether
    src/app.ts also needs an edit is genuinely unresolved by the evidence here
    (its current one-line body does not fail either way), which is exactly why
    it stays a listed impact site rather than being dropped.
