  summary: "My first review (claude-2026-08-19-npm-return-value-a) recorded only
    'return-value' as the ground-truth upstream finding, treating the
    type-surface signature-changed fact and the behavioural return-value-changed
    fact as the same finding reported once. Rerunning the deterministic
    benchmark, drift-full-pipeline correctly produced BOTH as separate findings,
    from two independently-computed evidence sources (a real .d.ts diff via
    fetchTypeSurface, and a real runtime probe via localPackageEnvironment). On
    reflection this is correct, not an over-report: they are two independently
    obtained pieces of evidence for the same underlying break, exactly analogous
    to two different reviewers independently confirming the same fact —
    production Drift's own evidence model treats them as distinct
    StructuredFindings for a reason (a repository with types but no working
    install would only get one of the two; a repository that can run the code
    but has no .d.ts would only get the other). Ground truth should credit both,
    not collapse them. This is a review correction, not a case of accepting
    Drift's output as truth: I re-examined the same fixture evidence I already
    had (the .d.ts diff and the behaviour of both formatUser implementations)
    and concluded my original single-finding model under-specified what a full
    and complete review should state."
