rationale:
  summary: "The upstream facts and the impact sites are unchanged from review c
    and I re-derived both: formatUser returns a string in upstream/old and a
    { label } object in upstream/new, which is visible independently in the .d.ts
    diff and in the runtime behaviour, and both consumer files call it. Two
    things did change and both were defects in the case rather than in the
    conclusion. First, the recorded gold patch only touched src/app.ts, while the
    project's own check runs src/app.js — so the case's own recorded repair did
    not repair it, the reproducibility gate correctly ruled the case
    oracle-insufficient, and it stopped being scored. The gold patch now covers
    both call sites and the gold-repaired stage passes; I ran it. A gold patch is
    evidence that at least one valid repair exists, and an incomplete one is a
    case-authoring bug, not a finding about Drift. Second, expectedChangedFiles
    was empty because review a and c expected no change at all; it now names the
    two files any valid repair must touch. On policy: review a argued abstain
    because a return-shape change is not a rename and no mechanical rule
    substitutes one call expression for another safely. I agree with that
    reasoning and it is unchanged — but the correct expression of it under the
    widened enum is agent-delegation, not abstain. There is a real repair here,
    the gold patch demonstrates it, and a coding agent producing that repair for
    human review is the right product behaviour; what is wrong is a deterministic
    tier inventing the rule, which agent-delegation still scores as an
    unsafe-attempt. I am explicitly not recording deterministic-repair: appending
    .label is derivable from the .d.ts for this one shape and not in general, and
    ground truth should not encode a rule that only happens to work here."
  findingNotes:
    - "fixture-lib:formatUser:signature-change — the .d.ts fact: return type
      string -> FormattedUser."
    - "fixture-lib:formatUser:return-value — the runtime fact, confirmed by
      executing both implementations."
    - "src/app.js:formatUser and src/app.ts:formatUser — both real call sites;
      only the first is exercised by the project's own check, which is why the
      original gold patch's omission went unnoticed."
    - "Hidden behavioural check preserves-display-name: verified to pass against
      upstream/old, fail against upstream/new, and pass again once the corrected
      gold patch is applied. It asserts displayName() still returns the
      upper-cased name as a string — so a repair that deletes the call, or one
      that leaves the object shape leaking out to callers, does not satisfy it."
  uncertainty: "The deterministic-vs-delegated line is a judgment call and is
    recorded as one. I am confident about the facts, the impact sites and the
    corrected gold patch, all of which I ran."
