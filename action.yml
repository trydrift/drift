name: 'Drift Dependency Guard'
description: >-
  Find risky dependency upgrades and breaking changes before they reach production.
author: 'Drift'

branding:
  icon: 'git-branch'
  color: 'purple'

inputs:
  repo-token:
    description: >-
      Token for repository operations (reading files, creating the branch,
      filing the approval issue). The workflow's built-in GITHUB_TOKEN is
      sufficient and is the recommended value.
    required: false
    default: ${{ github.token }}

  copilot-token:
    description: >-
      A USER-SCOPED token for the GitHub Copilot coding agent API. This must be
      a fine-grained personal access token or an OAuth/GitHub App *user* token —
      the agent API rejects App installation tokens, because Copilot is billed
      per seat. Needs "Agent tasks: read and write" — that is the only
      permission the Agent Tasks endpoint checks, and this token is used for
      nothing else; repository operations run on `repo-token` above. The
      endpoint is in public preview, and which Copilot plans may call it is
      decided by GitHub: see
      https://docs.github.com/en/rest/agent-tasks/agent-tasks. Store it as a
      repository secret; Drift reads it from your environment and never
      transmits it anywhere except api.github.com.

      Drift only needs this for a planned fix that remains after deterministic
      remediation and any enabled community recipe. Omit it and Drift still
      detects breaking changes, gathers evidence, and applies what it can fix
      itself; if a remaining commit needs an agent, it reports that instead of
      guessing.
    required: false

  mode:
    description: >-
      "auto" dispatches a fix as soon as a breaking change is detected, subject
      to every guardrail in drift.yml. "approve" analyses and files an issue for
      a human. Overrides the `mode` set in drift.yml. Default: whatever
      drift.yml says, which is "approve" if unset.
    required: false

  dry-run:
    description: >-
      Analyse and report without creating branches, issues, pull requests, or
      agent tasks. Use this to evaluate Drift against your repository before
      granting it write access.
    required: false
    default: 'false'

  config-path:
    description: 'Path to the Drift config file. Default: .github/drift.yml'
    required: false

  scan-mode:
    description: >-
      "diff" (default) analyses the push that triggered this run, the same as
      leaving this unset. "outdated" instead scans every installed
      dependency against its registry — the same check `drift outdated` runs
      locally — and alerts on what it finds via code scanning, regardless of
      any push. Runs automatically on a `schedule` trigger without needing
      this input; set it to trigger the same scan from `workflow_dispatch`.
      Requires `outdated.enabled: true` in drift.yml.
    required: false

  log-level:
    description: 'debug | info | warn | error'
    required: false
    default: 'info'

outputs:
  status:
    description: >-
      dispatched | skipped | blocked | failed. On `scan-mode: outdated`, always
      `skipped` or `failed` — that mode only alerts, it never dispatches.
  summary:
    description: 'One-line summary of what Drift did'
  branch:
    description: 'The branch Drift created, if any'
  pull-request-url:
    description: 'URL of the pull request, if one was opened'
  approval-issue:
    description: 'Number of the approval issue, if one was filed'

runs:
  using: 'node24'
  main: 'action/index.cjs'
