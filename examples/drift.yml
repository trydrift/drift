# Drift configuration — copy to `.github/drift.yml`.
#
# Every value below is the default. You can delete this whole file and Drift
# still works; it will run in `approve` mode and ask before touching anything.
#
# Full reference: docs/configuration.md

# ---------------------------------------------------------------------------
# Autonomy
# ---------------------------------------------------------------------------

# `approve` — Drift analyses, files an issue with the plan, and waits for you
#             to comment `/drift apply`.
# `auto`    — Drift dispatches Copilot the moment it detects a breaking change,
#             subject to every guardrail below.
#
# Start on `approve`. Read a few plans. Move to `auto` when they stop
# surprising you.
mode: approve

# In `auto` mode, plans riskier than this fall back to asking a human instead
# of being dispatched. Nothing is ever dropped — you still get the issue.
maxAutoRisk: medium

# Branches whose dependency changes Drift watches.
watchBranches: [main, master, develop]

# ---------------------------------------------------------------------------
# What to analyse
# ---------------------------------------------------------------------------

# Every ecosystem Drift can detect, which is also the default — so this line
# exists to show you the names, not to change anything. Delete it and nothing
# happens; narrow it and Drift stops looking at the ones you removed.
#
# It used to read `[npm, pypi, go, cargo, maven, rubygems]` under a heading
# promising every value here was the default. Copying the recommended config
# therefore switched off ten ecosystems, silently, and made the product worse
# than not configuring it at all.
ecosystems:
  [
    npm,
    pypi,
    go,
    cargo,
    maven,
    rubygems,
    nuget,
    packagist,
    hex,
    pub,
    swift,
    cocoapods,
    opam,
    conan,
    vcpkg,
    arduino,
  ]

triggerOn:
  major: true
  minor: true
  # Patch releases do sometimes break consumers, but they are a large majority
  # of all dependency churn, so analysing them is mostly noise. Turn it on if
  # you have been burned.
  patch: false
  # Lockfile-only moves you didn't ask for. Off by default because transitive
  # churn is constant and rarely actionable.
  transitive: false
  # Dev dependencies rarely break production code paths.
  dev: false

# Never analyse these. Glob patterns match the package name.
ignore: []
#  - "@types/*"
#  - "eslint*"

# Always require a human, even in `auto` mode. Use this for the dependencies
# that would ruin your week.
alwaysApprove: []
#  - "stripe"
#  - "next"

# ---------------------------------------------------------------------------
# Evidence — how Drift learns what actually changed upstream
# ---------------------------------------------------------------------------

evidence:
  githubReleases: true
  changelog: true

  # Diffs the actual TypeScript declarations of the old and new versions.
  # This is the strongest signal available for npm packages, and the answer to
  # changelogs that omit a removal.
  typeSurface: true

  openapi: true

  # OpenAPI specs this repo *consumes*. Drift diffs these between commits and
  # finds the client code that breaks — this catches upstream service changes
  # that no package manager would ever tell you about.
  openapiSpecs: []
  #  - "api/openapi.yaml"
  #  - "spec/partner-api.json"

  maxReleases: 25

# ---------------------------------------------------------------------------
# Guardrails — the reason it's safe to leave `auto` on
# ---------------------------------------------------------------------------

guardrails:
  # Drift will not direct an agent to edit anything matching these.
  protectedPaths:
    - '.github/workflows/**'
    - '**/*.lock'
    - 'infra/**'
    - 'terraform/**'
    - '**/secrets/**'

  # A plan wider than this asks for a human first.
  maxFilesChanged: 50

  # Batched upgrades make regressions hard to attribute.
  maxDependenciesPerRun: 10

  # Refuse to dispatch on a version number alone, with no changelog, release
  # notes, or API diff to justify it. Strongly recommended.
  requireEvidence: true

  # Findings below this confidence are reported but not acted on unattended.
  minConfidence: medium

  # Tells the agent, explicitly, not to make tests pass by weakening them.
  forbidTestWeakening: true

# ---------------------------------------------------------------------------
# How the fix is produced
# ---------------------------------------------------------------------------

remediation:
  # `per-breaking-change` — one commit per issue (recommended: revert and
  #                         bisect stay meaningful)
  # `per-dependency`      — one commit per package
  # `single`              — one commit for everything
  commitGranularity: per-breaking-change

  branchPrefix: 'drift/'

  # `remediation.draftPr` used to live here. It is deprecated in favour of
  # `pullRequest.draft` below, which is the one setting that decides this now.
  # An existing config that still sets it keeps working.

  # Optional model hint for the Copilot agent.
  # model: ""

  # Appended verbatim to every agent task. Put your repo's conventions here.
  customInstructions: ''
  # customInstructions: |
  #   This repo uses Vitest, not Jest. Run `pnpm test` to verify.
  #   Prefer named exports. Do not add barrel files.

  # Off by default. When true, Drift queries Codemod.com and Maven Central
  # (for OpenRewrite) live for a matching, version-pinned recipe once its own
  # codemod engine cannot resolve a commit — no network call to either
  # happens while this is false. On the Action this is the only thing that
  # can select a found recipe, since it cannot prompt; the CLI and VS Code
  # extension still ask before using one either way.
  communityRecipes: false

# ---------------------------------------------------------------------------
# How the pull request gets opened
# ---------------------------------------------------------------------------

# Every value here is commented out because every value here is already the
# default. Uncomment the ones you want to change.
#
# pullRequest:
#   # Open a pull request once the branch is pushed. Drift never merges it.
#   enabled: true
#
#   # `ask` confirms the branch name and title first, in the CLI and the panel.
#   # The Action ignores this and proceeds; there is nobody there to ask.
#   confirm: ask
#
#   # `branched-from` targets whatever the work started from, which is right on
#   # any team that does not develop directly on its default branch.
#   base: branched-from
#
#   # Open as a draft for a human to promote. This is the only setting that
#   # decides it — the old `remediation.draftPr` is deprecated and is consulted
#   # only when this is unset.
#   draft: true
#
#   labels: []
#   reviewers: []
#
#   # Placeholders: {prefix} {summary} {name} {from} {to} {count} {date}
#   branchTemplate: '{prefix}upgrade-{summary}-{date}'
#   titleTemplate: 'chore(deps): upgrade {summary}'
#
#   # Credit Drift as a co-author. You stay the author: you chose the upgrade
#   # and reviewed the diff.
#   coAuthor: true

# ---------------------------------------------------------------------------
# Code scanning alerts
# ---------------------------------------------------------------------------

# Every plan Drift produces — breaking or not — can also be uploaded as SARIF
# to the repository's code scanning dashboard: one alert per breaking change,
# listing every location it reaches (one per package for a move with no
# breaking change of its own), carrying the same evidence, location, and fix
# a pull request would. Needs `security-events: write` on the workflow; see
# examples/workflows/drift.yml.
codeScanning:
  enabled: true
  # Also alert on findings that wouldn't produce a commit on their own — a
  # resolved or newly introduced advisory with no breaking change, say.
  includeInformational: true

# Proactive scanning of every *installed* dependency against its registry,
# independent of any push — the same check `drift outdated` runs locally.
# Off by default because it needs a `schedule` trigger of its own; see
# examples/workflows/drift-outdated.yml.
outdated:
  enabled: false

# ---------------------------------------------------------------------------
# Optional LLM assistance
# ---------------------------------------------------------------------------

# Off by default. Drift's deterministic rule engine needs no API key and no
# model. Enable this only to improve recall on prose changelogs that the rules
# cannot parse — findings it produces are capped at `medium` confidence and so
# can never clear the dispatch gate on their own.
llm:
  enabled: false
  provider: anthropic
  model: claude-opus-5
  effort: medium
  apiKeyEnv: ANTHROPIC_API_KEY
