# Drift — detect breaking dependency changes and fix them.
#
# GENERATED FILE. Edit scripts/build-workflow.mjs, then run `npm run build:workflow`.
# The dependency path list below comes from Drift's own manifest registry, so a
# file Drift can parse is a file this workflow starts on. Hand-editing it is how
# the two fall out of step, and a workflow that never starts is indistinguishable
# from a repository with nothing to report.
#
# Copy this file to `.github/workflows/drift.yml`.
#
# Three things to know before you enable it:
#
#   1. `copilot-token` is optional. Drift only needs it when a planned fix
#      remains after deterministic remediation and any enabled community
#      recipe. If you add it, it must be a USER-scoped token (a fine-grained
#      PAT) with "Agent tasks: read and write" — the only permission the Agent
#      Tasks endpoint checks. GitHub's Copilot agent API rejects the built-in
#      GITHUB_TOKEN and any GitHub App installation token, because Copilot is
#      billed per seat. See docs/copilot-integration.md.
#
#   2. Drift ships in `approve` mode by default: it analyses, files an issue,
#      and waits for you. Switch to `auto` in `.github/drift.yml` once you
#      trust what it produces.
#
#   3. Every plan is also uploaded to the Security tab as a code scanning
#      alert, one per affected package, with the same evidence and fix a pull
#      request would carry — set `codeScanning.enabled: false` in
#      `.github/drift.yml` to turn that off. To also alert on dependencies
#      nobody has bumped yet, see examples/workflows/drift-outdated.yml.

name: Drift

on:
  push:
    # Deliberately unfiltered by branch. Which branches Drift acts on is
    # `watchBranches` in .github/drift.yml (default: main, master, develop),
    # and the Action enforces it — see `runners/action.ts`. Filtering here as
    # well meant the config could not be honoured: a team that set
    # `watchBranches: [develop]` got a workflow that still only ran on main,
    # and nothing said why. One source of truth, and it is the config.
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/bun.lock'
      - '**/requirements*.txt'
      - '**/constraints*.txt'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/uv.lock'
      - '**/Pipfile'
      - '**/Pipfile.lock'
      - '**/setup.py'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pom.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/gradle/libs.versions.toml'
      - '**/gradle.lockfile'
      - '**/build.sbt'
      - '**/project/*.scala'
      - '**/Gemfile'
      - '**/Gemfile.lock'
      - '**/*.gemspec'
      - '**/*.csproj'
      - '**/*.fsproj'
      - '**/*.vbproj'
      - '**/Directory.Packages.props'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/composer.json'
      - '**/composer.lock'
      - '**/mix.exs'
      - '**/mix.lock'
      - '**/rebar.config'
      - '**/pubspec.yaml'
      - '**/pubspec.yml'
      - '**/pubspec.lock'
      - '**/Package.swift'
      - '**/Package@swift-*.swift'
      - '**/Package.resolved'
      - '**/Podfile'
      - '**/Podfile.lock'
      - '**/dune-project'
      - '**/*.opam'
      - '**/*.opam.locked'
      - '**/conanfile.txt'
      - '**/conanfile.py'
      - '**/conan.lock'
      - '**/vcpkg.json'
      - '**/vcpkg-configuration.json'
      - '**/library.properties'
      - '**/platformio.ini'

  # Lets you re-run Drift against the current commit from the Actions tab.
  workflow_dispatch:

  # Enables the `/drift apply` approval flow on issues Drift files.
  #
  # Drift re-checks everything about an approval itself: that the commenter has
  # write access, that the issue is one Drift filed, and that the plan it is
  # about to run is the plan recorded on the issue. The filter below is only a
  # cheap prefilter to avoid starting a runner for every comment in the repo.
  issue_comment:
    types: [created]

# Prevents two Drift runs from racing to create the same branch.
concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    # On comment events, only run for `/drift apply` on a Drift issue.
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.comment.body, '/drift apply') &&
       contains(github.event.issue.labels.*.name, 'drift'))

    runs-on: ubuntu-latest

    permissions:
      contents: write # create the fix branch
      issues: write # file and comment on the approval issue
      pull-requests: write # let Copilot open the PR
      checks: write # post the Drift check run
      security-events: write # upload code scanning alerts (codeScanning.enabled in drift.yml)

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Drift needs the previous commit to diff manifests against, and the
          # working tree to search for affected code.
          #
          # On an `issue_comment` run this checks out the default branch, not
          # the commit being approved. Drift verifies the two match before using
          # the working tree, and skips localization (saying so in the report)
          # rather than reporting impact sites from the wrong tree.
          fetch-depth: 2

      # ----------------------------------------------------------------------
      # Toolchains.
      #
      # Drift's evidence is stronger when the ecosystem's own tooling is on the
      # runner: it can compute an API surface directly instead of falling back
      # to release notes and changelogs. Where a toolchain is missing, Drift
      # says so in the report rather than quietly reporting less — but "the same
      # analysis you get locally" is only true if the runner has what your
      # laptop has.
      #
      # Go is set up below because it is the most common case. Add the ones your
      # repository needs and delete the rest; each is `continue-on-error` so a
      # repository without that ecosystem is unaffected.
      # ----------------------------------------------------------------------

      - name: Set up Go
        uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version-file: go.mod
          cache: true

      # Rust — enables a computed API surface for crates.
      # - name: Set up Rust
      #   uses: dtolnay/rust-toolchain@stable
      #   continue-on-error: true

      # JVM — enables reading the published API out of jars.
      # - name: Set up Java
      #   uses: actions/setup-java@v4
      #   continue-on-error: true
      #   with:
      #     distribution: temurin
      #     java-version: '21'

      # .NET — enables reading assembly metadata.
      # - name: Set up .NET
      #   uses: actions/setup-dotnet@v4
      #   continue-on-error: true

      # Python — enables reading a wheel's declared modules.
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   continue-on-error: true
      #   with:
      #     python-version: '3.12'

      - name: Run Drift
        id: drift
        uses: trydrift/drift@v0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          copilot-token: ${{ secrets.DRIFT_COPILOT_TOKEN }}

      - name: Report outcome
        if: always()
        run: echo "${{ steps.drift.outputs.status }}: ${{ steps.drift.outputs.summary }}"
