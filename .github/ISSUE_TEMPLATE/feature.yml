name: Feature request
description: Suggest something Drift doesn't do yet.
labels: ["feature-request", "enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search existing feature requests first. If one already represents your request, add a 👍 reaction there instead of opening a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Drift to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried, if any
    validations:
      required: false
