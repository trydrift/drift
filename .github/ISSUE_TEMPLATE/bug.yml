name: Bug report
description: Something crashed, hung, or behaved incorrectly (not an analysis-accuracy issue — use "Incorrect analysis" for that).
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Drift surface and version/commit
      placeholder: CLI v0.1.0, GitHub Action @<sha>, VS Code extension v0.1.0, webhook server ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Run with `--log-level debug` if you can.
      render: shell
    validations:
      required: false
