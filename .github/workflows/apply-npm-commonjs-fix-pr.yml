name: Apply npm CommonJS compatibility fix on PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/npm-commonjs-require-conditions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npm-commonjs-require-conditions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch explicit require handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/evidence/type-surface.ts')
          source = path.read_text()
          old = '''function exportValueLooksCommonJs(value: unknown, manifest: Manifest): boolean {
            if (typeof value === 'string') return entryLooksCommonJs(value, manifest);
            if (Array.isArray(value)) return value.some((nested) => exportValueLooksCommonJs(nested, manifest));
            if (!value || typeof value !== 'object') return false;

            const record = value as Record<string, unknown>;
            if ('require' in record) return exportValueLooksCommonJs(record.require, manifest);
            if ('node' in record && exportValueLooksCommonJs(record.node, manifest)) return true;
            if ('default' in record) return exportValueLooksCommonJs(record.default, manifest);
            return false;
          }
'''
          new = '''function exportValueLooksCommonJs(value: unknown, manifest: Manifest): boolean {
            if (typeof value === 'string') return entryLooksCommonJs(value, manifest);
            if (Array.isArray(value)) return value.some((nested) => exportValueLooksCommonJs(nested, manifest));
            if (!value || typeof value !== 'object') return false;

            const record = value as Record<string, unknown>;
            if ('require' in record) return exportRequireValueLooksCommonJs(record.require);
            if ('node' in record && exportValueLooksCommonJs(record.node, manifest)) return true;
            if ('default' in record) return exportValueLooksCommonJs(record.default, manifest);
            return false;
          }

          /**
           * An explicit `exports.require` branch is positive Node package-contract
           * evidence that the selected target is meant for `require(...)`. In
           * particular, do not reinterpret an ambiguous `.js` target using the root
           * package `type`: tshy-style dual packages commonly keep `type: module`
           * at the root while routing `require` to a CommonJS build.
           *
           * An explicit ESM extension is contradictory evidence and remains unsafe.
           */
          function exportRequireValueLooksCommonJs(value: unknown): boolean {
            if (typeof value === 'string') {
              if (/\\.mjs$/i.test(value)) return false;
              return true;
            }
            if (Array.isArray(value)) {
              return value.some((nested) => exportRequireValueLooksCommonJs(nested));
            }
            if (!value || typeof value !== 'object') return false;

            const record = value as Record<string, unknown>;
            if ('require' in record) return exportRequireValueLooksCommonJs(record.require);
            if ('node' in record && exportRequireValueLooksCommonJs(record.node)) return true;
            if ('default' in record && exportRequireValueLooksCommonJs(record.default)) return true;
            return false;
          }
'''
          if old not in source:
              raise SystemExit('expected CommonJS block not found; refusing to patch')
          path.write_text(source.replace(old, new, 1))

          Path('test/npm-commonjs-exports.test.ts').write_text(r'''import { afterEach, test } from 'node:test';
          import assert from 'node:assert/strict';
          import { diffPackageModuleMetadata } from '../dist/evidence/type-surface.js';
          import { clearHttpCache } from '../dist/util/http.js';

          const originalFetch = globalThis.fetch;

          afterEach(() => {
            globalThis.fetch = originalFetch;
            clearHttpCache();
          });

          function response(manifest: unknown): Response {
            return new Response(JSON.stringify(manifest), {
              status: 200,
              headers: { 'content-type': 'application/json' },
            });
          }

          function mock(before: unknown, after: unknown): void {
            clearHttpCache();
            globalThis.fetch = async (input) => {
              const url = String(input);
              if (url.includes('@1.0.0/package.json')) return response(before);
              if (url.includes('@2.0.0/package.json')) return response(after);
              return new Response('not found', { status: 404 });
            };
          }

          for (const packageName of ['lru-cache', 'glob', 'rimraf']) {
            test(`${packageName}: explicit exports.require survives root type=module`, async () => {
              mock(
                { main: './index.js' },
                {
                  type: 'module',
                  exports: {
                    '.': {
                      import: './dist/esm/index.js',
                      require: './dist/commonjs/index.js',
                    },
                  },
                },
              );
              const changes = await diffPackageModuleMetadata(packageName, '1.0.0', '2.0.0');
              assert.equal(changes.some((c) => c.kind === 'commonjs-entry-removed'), false);
              assert.equal(changes.some((c) => c.kind === 'package-type-changed'), false);
            });
          }

          test('genuine root require-condition removal remains breaking', async () => {
            mock(
              { type: 'module', exports: { '.': { import: './esm.js', require: './commonjs.js' } } },
              { type: 'module', exports: { '.': { import: './esm.js' } } },
            );
            const changes = await diffPackageModuleMetadata('dual-package', '1.0.0', '2.0.0');
            assert.ok(changes.some((c) => c.kind === 'exports-require-condition-removed'));
          });

          test('a require branch targeting .mjs is not trusted', async () => {
            mock(
              { main: './index.js' },
              { type: 'module', exports: { '.': { require: './index.mjs' } } },
            );
            const changes = await diffPackageModuleMetadata('broken-dual', '1.0.0', '2.0.0');
            assert.ok(changes.some((c) => c.kind === 'commonjs-entry-removed'));
          });
          ''')
          PY
      - run: npm run build
      - run: node --test test/npm-commonjs-exports.test.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:action
      - run: npm run verify:action-bundle
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "drift-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-npm-commonjs-fix.yml .github/workflows/apply-npm-commonjs-fix-pr.yml
          git add src/evidence/type-surface.ts test/npm-commonjs-exports.test.ts action/dist
          git commit -m "fix(npm): trust explicit CommonJS require exports"
          git push origin HEAD:fix/npm-commonjs-require-conditions
