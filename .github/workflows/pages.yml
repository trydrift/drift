name: Deploy site to GitHub Pages

# The landing page is a static export of `site/`, published to GitHub Pages.
#
# It deploys on a push to main that actually touched the site, and on demand.
# Scoping the paths matters more here than usual: the recordings under
# `site/src/data` are only regenerated by running `npm run capture` locally
# against real repositories, so a deploy triggered by an unrelated commit would
# republish byte-identical output and spend a Pages deployment saying nothing.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      # A project page is served from `https://<owner>.github.io/<repo>/`, so
      # every asset URL needs that prefix or the deployed page loads no CSS at
      # all — while working perfectly in local dev, which is what makes it a
      # nasty failure. `configure-pages` reports the real base path for this
      # repository, including when a custom domain removes it entirely.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # `enablement: true` was tried here and cannot work: creating a Pages
        # site needs a permission the workflow's GITHUB_TOKEN does not have
        # ("Resource not accessible by integration"), and asking for it turned
        # a clear "Pages is not enabled" message into a confusing one about
        # permissions. Enabling Pages is a repository setting and stays one:
        #
        #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
        #
        # Done once. Everything after it — including the base path this step
        # reports — is handled here.

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Pages runs no build of its own, and Jekyll would otherwise strip files
      # and directories beginning with an underscore — which is where Next puts
      # every script and stylesheet it emits.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
