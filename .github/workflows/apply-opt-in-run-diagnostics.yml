name: Apply opt-in run diagnostics

on:
  push:
    branches:
      - feat/opt-in-run-diagnostics

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-opt-in-run-diagnostics.mjs')
          source = path.read_text().replace('Run diagnostics for `analyze`, `outdated`, `fix`, and `pr`:', 'Run diagnostics for repository commands:')
          path.write_text(source)
          PY
          node scripts/apply-opt-in-run-diagnostics.mjs
          python - <<'PY'
          from pathlib import Path
          cli = Path('src/cli.ts')
          source = cli.read_text()
          helper = "/**\n * Run recording is a local diagnostic preference, not repository policy.\n * Explicit CLI flags win over the machine-level environment opt-in.\n */\nexport function shouldRecordRun(\n  flags: Readonly<Record<string, string | boolean>>,\n  env: NodeJS.ProcessEnv = process.env,\n): boolean {\n  if (flags['no-record-run'] === true) return false;\n  if (flags['record-run'] === true) return true;\n  const value = env.DRIFT_RECORD_RUNS?.trim().toLowerCase();\n  return value === '1' || value === 'true';\n}\n\n"
          if helper not in source: raise SystemExit('inline shouldRecordRun helper not found')
          source = source.replace(helper, '')
          anchor = "import { countWork, redactCommand, redactText, startRunLog, startSpan, withSpan } from './util/diagnostics.js';\n"
          if anchor not in source: raise SystemExit('diagnostics import anchor not found')
          source = source.replace(anchor, anchor + "import { shouldRecordRun } from './util/run-recording.js';\n")
          cli.write_text(source)
          util = "/**\n * Decide whether this CLI invocation should create a repo-local run log.\n * Recording is off by default; explicit CLI flags override the machine-level\n * environment preference.\n */\nexport function shouldRecordRun(\n  flags: Readonly<Record<string, string | boolean>>,\n  env: NodeJS.ProcessEnv = process.env,\n): boolean {\n  if (flags['no-record-run'] === true) return false;\n  if (flags['record-run'] === true) return true;\n  const value = env.DRIFT_RECORD_RUNS?.trim().toLowerCase();\n  return value === '1' || value === 'true';\n}\n"
          Path('src/util/run-recording.ts').write_text(util)
          test = Path('test/cli-run-recording.test.ts')
          test.write_text(test.read_text().replace("from '../dist/cli.js';", "from '../dist/util/run-recording.js';"))
          PY

      - name: Install CLI dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npm run typecheck

      - name: Test CLI
        id: cli_tests
        run: npm test > cli-test.log 2>&1

      - name: Upload CLI test log
        if: failure() && steps.cli_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-log
          path: cli-test.log

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Test extension
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Commit verified implementation
        run: |
          git rm scripts/apply-opt-in-run-diagnostics.mjs .github/workflows/apply-opt-in-run-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts src/util/diagnostics.ts src/util/run-recording.ts test/cli-run-recording.test.ts extension/src/extension.ts extension/src/run-diagnostics.ts extension/src/run-recording.ts extension/package.json extension/test/run-diagnostics.test.ts
          git commit -m "feat: make run diagnostics opt-in"
          git push origin HEAD:feat/opt-in-run-diagnostics
