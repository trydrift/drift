name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # `npm test` runs test/*.test.ts directly via `node --experimental-strip-types`,
        # a flag Node did not have before 22.6 — this is the actual floor, not a
        # preference. See `engines.node` in package.json.
        node: [22]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Action is declared `using: node24`, which is not the version the
      # rest of this job runs on. `verify:action-bundle` executes the shipped
      # bundle against this binary, because a bundle that works on 22 is not
      # evidence it works on the runtime GitHub will actually use.
      - name: Install Node 24 for the Action runtime check
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Record the Node 24 binary
        run: echo "DRIFT_NODE24=$(which node)" >> "$GITHUB_ENV"

      # Restore the job's own Node version; the step above left 24 on PATH.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Root/extension package.json and package-lock.json must all report the
      # same product version, so a release never has to notice this after a
      # tag is already public. No tag exists on a PR, so this only checks
      # cross-manifest agreement — release.yml adds the tag comparison itself.
      - name: Verify version consistency across manifests
        run: npm run release:version

      - name: Test release tooling
        run: npm run test:release

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds first, so this also verifies the shipped artifact.
      - name: Test
        run: npm test

      # The extension has its own suite: the panel is rendered in plain Node and
      # asserted against, which is the only automated check on the UI markup.
      - name: Extension typecheck and tests
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test

      # A panel that typechecks but does not bundle is still a broken extension.
      - name: Verify the extension bundles
        working-directory: extension
        run: npm run build

      # Catches anything `vsce` itself would reject (bad manifest fields,
      # missing files, an over-broad .vscodeignore) before it blocks a release —
      # this is the actual artifact `publish:pre` would ship, built the same way.
      - name: Package the extension VSIX
        working-directory: extension
        run: npm run package

      # The bundled action is committed, because GitHub Actions does not run
      # npm install for node24 actions. A stale bundle is the classic silent
      # failure for this pattern: source is fixed, shipped action is not.
      # Also runs the bundle with node_modules removed (catching anything left
      # unbundled) and confirms the optional Anthropic SDK — which has no
      # node_modules to fall back on inside a real Action run — is statically
      # bundled, not just referenced. Shared with release.yml via the same
      # script so the two checks cannot drift apart.
      - name: Verify the Action bundle (rebuild, staleness, self-containment, bundled SDK, Node 24)
        run: npm run verify:action-bundle

      - name: Verify the CLI runs from source
        run: node dist/cli.js --version

      # The check above only proves the source tree works. This proves the
      # artifact a user actually installs does: `npm pack`, install that
      # tarball into a clean temp directory, and run `drift --version`,
      # `--help`, and the offline `analyze`/`fix`/`pr` error paths against it —
      # catching a bad `bin` path, a missing `files` entry, or an import that
      # only resolves inside this source tree.
      - name: Smoke-test the packed CLI artifact
        run: npm run smoke:packed-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ground-truth integrity: every benchmark-ready fixture must have a
      # valid, non-stale, accepted adjudication before its numbers are
      # allowed to count. Runs before the harness itself so a broken/missing
      # review fails here, not as a confusing downstream scoring anomaly.
      - name: Validate benchmark review/adjudication integrity
        run: npm run eval:review:validate

      - name: Run the eval harness's own test suite
        run: npm run eval:test

      # The harness is TypeScript that `node --test` strips rather than
      # compiles, so nothing else would catch a type error in it.
      - name: Typecheck the benchmark harness
        run: npm run eval:typecheck

      # A fixture-based regression check for the deterministic pipeline.
      # Fails only on harness-integrity problems (false-safe, a production
      # scope escape — Drift's own repair edited a file outside its plan's
      # declared scope — or a failed review/adjudication validation) — a
      # genuine Drift detection or repair miss on a hard fixture is a
      # reportable metric, not a CI break. See eval/README.md.
      - name: Run the deterministic evaluation harness
        run: npm run eval:deterministic

      # The case-based benchmark, deterministic tracks only. `run` makes zero
      # model calls here: only `detect-end-to-end` and `repair-codemod` are
      # selected, and both are model-free by construction. `evaluate` never
      # calls anything at all, so a live-AI run recorded on another machine is
      # re-scored in CI for free.
      #
      # This fails on an integrity break only — a false-safe, a production
      # scope escape, an unaudited prediction workspace, or an artifact scored
      # against case evidence it never saw. A missed detection or a failed
      # repair is a product result, and failing CI on one is how a benchmark
      # starts being tuned away from measuring the product.
      - name: Run the deterministic benchmark tracks
        run: npm run eval:bench -- run --run-id ci-${{ github.sha }}

      - name: Evaluate the benchmark run
        run: npm run eval:bench -- evaluate ci-${{ github.sha }}

      # The workflow's trigger paths are generated from Drift's own manifest
      # registry. A hand-edit here means the Action stops starting on files
      # Drift can parse, which nothing else would report.
      - name: Verify the example workflow matches the manifest registry
        run: npm run verify:workflow

      # Invented CLI commands, invented extension identifiers, stale identity
      # strings, and any wording that sells an unchecked result as a pass.
      - name: Verify the READMEs and docs against the code
        run: npm run check:docs

      - name: Verify the example config parses
        run: |
          node -e "
            const {readFileSync} = require('fs');
            const {parseConfig} = require('./dist/config/load.js');
            const {problems} = parseConfig(readFileSync('examples/drift.yml','utf8'));
            if (problems.length) { console.error(problems); process.exit(1); }
            console.log('examples/drift.yml is valid');
          "

  # The site was outside every gate, which is exactly how it went on
  # advertising `drift audit` for a day after the command was deleted. A
  # production build also runs `check-commands.mjs`, which fails if the page
  # names a CLI command that does not exist.
  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # The site's sync scripts read the root build's generated data.
      - run: npm ci && npm run build

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  # Drift analysing its own dependency changes. The tool should survive being
  # pointed at itself, and this is the cheapest way to find out when it doesn't.
  dogfood:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build

      - name: Analyse this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/cli.js analyze --before "${{ github.event.pull_request.base.sha }}" --after "${{ github.sha }}"
