name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds first, so this also verifies the shipped artifact.
      - name: Test
        run: npm test

      # The bundled action is committed, because GitHub Actions does not run
      # npm install for node20 actions. A stale bundle is the classic silent
      # failure for this pattern: source is fixed, shipped action is not.
      - name: Verify the committed action bundle is up to date
        run: |
          npm run build:action
          if ! git diff --quiet -- action/; then
            echo "::error::action/index.cjs is stale. Run 'npm run build:action' and commit the result."
            git diff --stat -- action/
            exit 1
          fi
          echo "action bundle is current"

      # Runs the bundle with node_modules removed entirely. If anything was left
      # unbundled it fails with ERR_MODULE_NOT_FOUND instead of Drift's own
      # error, which is exactly the case this catches.
      - name: Verify the action bundle is self-contained
        run: |
          mv node_modules node_modules.hidden
          node action/index.cjs > /tmp/out.txt 2>&1 || true
          mv node_modules.hidden node_modules
          cat /tmp/out.txt
          if grep -qE "Cannot find module|ERR_MODULE_NOT_FOUND|ERR_REQUIRE_ESM" /tmp/out.txt; then
            echo "::error::bundle is not self-contained"; exit 1
          fi
          grep -q "drift:error" /tmp/out.txt \
            || { echo "::error::bundle did not reach Drift's own code"; exit 1; }

      - name: Verify the CLI runs
        run: node dist/cli.js --version

      - name: Verify the example config parses
        run: |
          node -e "
            const {readFileSync} = require('fs');
            const {parseConfig} = require('./dist/config/load.js');
            const {problems} = parseConfig(readFileSync('examples/drift.yml','utf8'));
            if (problems.length) { console.error(problems); process.exit(1); }
            console.log('examples/drift.yml is valid');
          "

  # Drift analysing its own dependency changes. The tool should survive being
  # pointed at itself, and this is the cheapest way to find out when it doesn't.
  dogfood:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build

      - name: Analyse this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/cli.js analyze --before "${{ github.event.pull_request.base.sha }}" --after "${{ github.sha }}"
