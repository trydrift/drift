name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds first, so this also verifies the shipped artifact.
      - name: Test
        run: npm test

      # The extension has its own suite: the panel is rendered in plain Node and
      # asserted against, which is the only automated check on the UI markup.
      - name: Extension typecheck and tests
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test

      # A panel that typechecks but does not bundle is still a broken extension.
      - name: Verify the extension bundles
        working-directory: extension
        run: npm run build

      # The bundled action is committed, because GitHub Actions does not run
      # npm install for node20 actions. A stale bundle is the classic silent
      # failure for this pattern: source is fixed, shipped action is not.
      - name: Verify the committed action bundle is up to date
        run: |
          npm run build:action
          if ! git diff --quiet -- action/; then
            echo "::error::action/index.cjs is stale. Run 'npm run build:action' and commit the result."
            git diff --stat -- action/
            exit 1
          fi
          echo "action bundle is current"

      # Runs the bundle with node_modules removed entirely. If anything was left
      # unbundled it fails with ERR_MODULE_NOT_FOUND instead of Drift's own
      # error, which is exactly the case this catches.
      - name: Verify the action bundle is self-contained
        run: |
          mv node_modules node_modules.hidden
          node action/index.cjs > /tmp/out.txt 2>&1 || true
          mv node_modules.hidden node_modules
          cat /tmp/out.txt
          if grep -qE "Cannot find module|ERR_MODULE_NOT_FOUND|ERR_REQUIRE_ESM" /tmp/out.txt; then
            echo "::error::bundle is not self-contained"; exit 1
          fi
          grep -q "drift:error" /tmp/out.txt \
            || { echo "::error::bundle did not reach Drift's own code"; exit 1; }

      # `llm.enabled: true` in the Action has no `npm install` to fall back on,
      # so the SDK must be *in* the bundle, not resolved from node_modules at
      # runtime. This is a regression guard for exactly that: a dynamic
      # `import()` built from a variable specifier defeats esbuild's static
      # bundling and passed every check above while silently degrading to
      # "SDK not installed" in every real Action run.
      - name: Verify the Anthropic SDK is bundled into the action, not just referenced
        run: |
          if ! grep -q "AnthropicError" action/index.cjs; then
            echo "::error::@anthropic-ai/sdk is not bundled into action/index.cjs — llm.enabled: true would silently fall back in the Action, which has no node_modules to resolve it from."
            exit 1
          fi

      - name: Verify the CLI runs
        run: node dist/cli.js --version

      # A fixture-based regression check for the deterministic pipeline —
      # small today (one fixture), but it existed with nothing stopping it
      # from regressing silently. Wiring it in now means the next fixture
      # someone adds is enforced from day one instead of needing a second PR
      # to remember CI.
      - name: Run the deterministic evaluation harness
        run: npm run eval:deterministic

      - name: Verify the example config parses
        run: |
          node -e "
            const {readFileSync} = require('fs');
            const {parseConfig} = require('./dist/config/load.js');
            const {problems} = parseConfig(readFileSync('examples/drift.yml','utf8'));
            if (problems.length) { console.error(problems); process.exit(1); }
            console.log('examples/drift.yml is valid');
          "

  # Drift analysing its own dependency changes. The tool should survive being
  # pointed at itself, and this is the cheapest way to find out when it doesn't.
  dogfood:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build

      - name: Analyse this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/cli.js analyze --before "${{ github.event.pull_request.base.sha }}" --after "${{ github.sha }}"
