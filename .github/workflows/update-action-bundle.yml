name: Update Action bundle

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'src/**'
      - 'scripts/build-action.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'action/**'
      - '!action/index.cjs'
      - '!action/behavioural-worker.js'

permissions: {}

concurrency:
  group: update-action-bundle-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Opening the PR needs contents: write (push the branch) and
    # pull-requests: write; scoped to this one job rather than the whole
    # workflow, matching every other workflow here. main requires a reviewed
    # PR, so this proposes the rebuilt bundle instead of pushing to main.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the action bundle
        run: npm run build:action

      - name: Open a PR with the rebuilt bundle
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "chore(action): update bundled action"
          title: "chore(action): update bundled action"
          body: Automated rebuild of `action/index.cjs` from the latest `action.yml`/`src/**` changes on `main`.
          branch: update-action-bundle
          delete-branch: true
          add-paths: action/index.cjs
