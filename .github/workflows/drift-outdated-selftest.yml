# Drift's outdated-dependency scan, running against Drift.
#
# The companion to drift-selftest.yml: that one reacts to a push that bumps a
# dependency, this one checks on a schedule whether anything in package.json
# is behind its registry right now, regardless of any push. See
# examples/workflows/drift-outdated.yml for the copy-paste version of this
# workflow every other repository gets.

name: Drift (outdated self-check)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write # upload code scanning alerts

jobs:
  outdated-selftest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # The committed bundle is what the action actually runs.
      - name: Build the action bundle
        run: npm ci && npm run build:action

      - name: Scan for outdated dependencies
        id: drift
        uses: ./
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          scan-mode: outdated
          log-level: debug

      - name: Result
        if: always()
        run: |
          echo "status:  ${{ steps.drift.outputs.status }}"
          echo "summary: ${{ steps.drift.outputs.summary }}"
