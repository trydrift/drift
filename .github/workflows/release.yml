name: Release

# A pushed stable tag (for example v0.1.0) starts two deliberately separate
# trust domains. `validate` runs every repository/dependency-controlled command
# without OIDC or repository write authority and uploads the exact npm tarball
# and VSIX it tested. Only `publish` can mint OIDC credentials or write
# repository contents, and it publishes those downloaded bytes without a
# checkout or rebuild.

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  # UNPRIVILEGED: build and test everything; create immutable release inputs.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require release commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

      # The Action declares `using: node24`. Preserve the binary before
      # restoring Node 22 for the rest of the repository validation.
      - name: Install Node 24 for the Action runtime check
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Record the Node 24 binary
        run: echo "DRIFT_NODE24=$(which node)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate stable release tag and version consistency
        run: node scripts/check-release-version.mjs --tag "${{ github.ref_name }}"

      - name: Test release tooling
        run: npm run test:release

      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:review:validate
      - run: npm run eval:test
      - run: npm run eval:deterministic

      - name: Verify the Action bundle (rebuild, staleness, self-containment, bundled SDK, Node 24)
        run: npm run verify:action-bundle

      - name: Verify the READMEs and docs against the code
        run: npm run check:docs

      - name: Verify the example workflow matches the manifest registry
        run: npm run verify:workflow

      - name: Build and test the site
        working-directory: site
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Extension — install, typecheck, test, build, package
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run package

      # Pack once. The smoke test consumes this exact tarball rather than
      # creating a throwaway package that could differ from the published one.
      - name: Pack and smoke-test the exact CLI artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          mapfile -t CLI_TARBALLS < <(find artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#CLI_TARBALLS[@]}" -eq 1
          CLI_TARBALL="${CLI_TARBALLS[0]}"
          npm run smoke:packed-cli -- "$CLI_TARBALL"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage and checksum the exact release artifacts
        run: |
          cp extension/drift.vsix artifacts/drift.vsix
          unzip -t artifacts/drift.vsix
          cd artifacts
          sha256sum ./*.tgz ./drift.vsix > SHA256SUMS

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # PRIVILEGED: verify and publish only the artifacts produced above.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install the npm publishing runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: release-artifacts

      # This job deliberately has no checkout. These checks read archive
      # metadata only; they never execute code from either release artifact.
      - name: Verify artifact checksums and identities
        id: artifacts
        shell: bash
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS

          mapfile -t CLI_TARBALLS < <(find . -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#CLI_TARBALLS[@]}" -eq 1
          CLI_TARBALL="${CLI_TARBALLS[0]}"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"

          CLI_NAME="$(tar -xOf "$CLI_TARBALL" package/package.json | jq -r '.name')"
          CLI_VERSION="$(tar -xOf "$CLI_TARBALL" package/package.json | jq -r '.version')"
          VSIX_NAME="$(unzip -p drift.vsix extension/package.json | jq -r '.name')"
          VSIX_PUBLISHER="$(unzip -p drift.vsix extension/package.json | jq -r '.publisher')"
          VSIX_VERSION="$(unzip -p drift.vsix extension/package.json | jq -r '.version')"

          test "$CLI_NAME" = '@usedrift/cli'
          test "$CLI_VERSION" = "$EXPECTED_VERSION"
          test "$VSIX_PUBLISHER.$VSIX_NAME" = 'drift.drift'
          test "$VSIX_VERSION" = "$EXPECTED_VERSION"

          echo "cli_tarball=release-artifacts/${CLI_TARBALL#./}" >> "$GITHUB_OUTPUT"
          echo "vsix=release-artifacts/drift.vsix" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN or NPM_TOKEN: npm Trusted Publishing exchanges this
      # job's OIDC identity for short-lived publish authority.
      - name: Publish exact CLI tarball to npm
        run: npm publish "${{ steps.artifacts.outputs.cli_tarball }}" --access public

      # No VSCE_PAT: the Marketplace trusts this workflow's OIDC identity.
      - name: Publish exact VSIX to the VS Code Marketplace
        run: npx --yes @vscode/vsce@3.9.1 publish --oidc --no-dependencies --packagePath "${{ steps.artifacts.outputs.vsix }}"

      # Registry publication must succeed before the GitHub Release exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "${{ steps.artifacts.outputs.vsix }}"

      # Update the lightweight major tag through the API, so the privileged
      # job never needs to checkout or execute repository contents.
      - name: Move the floating v0 tag
        if: startsWith(github.ref_name, 'v0.')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/v0" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/v0" \
              -f sha="${{ github.sha }}" \
              -F force=true
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref='refs/tags/v0' \
              -f sha="${{ github.sha }}"
          fi
