name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Validates every artifact —
# CLI, Action bundle, and VSIX — before publishing anything, then publishes
# the CLI to npm, the extension to the VS Code Marketplace, creates a GitHub
# Release, and moves the floating `v0` tag so `uses: trydrift/drift@v0`
# resolves to the newest `v0.x.y`.
#
# Publishing uses OIDC on both registries — npm Trusted Publishing and the
# VS Code Marketplace's `vsce ... --oidc` — so there is no long-lived
# NPM_TOKEN or VSCE_PAT secret in this repository. Both trust relationships
# are configured externally (npmjs.com, the Marketplace publisher settings),
# not here; see docs/deployment.md. `id-token: write` below is what lets this
# job mint the OIDC token each registry verifies.
#
# Ordering is deliberate: every validation step below runs to completion
# before the first irreversible action (an npm publish). A failure in
# extension packaging or CLI packaging must never happen after a public
# artifact has already been published, if it could have been caught first.

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # `gh release create` and moving the floating v0 tag both need contents:
    # write; scoped to this one job rather than the whole workflow. id-token:
    # write is for OIDC — both `npm publish` (Trusted Publishing) and
    # `vsce publish --oidc` mint a token from this to prove the publish is
    # coming from this exact workflow, in place of a stored credential.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # The Action declares `using: node24`. `verify:action-bundle` runs the
      # shipped bundle against this binary, because publishing an Action that
      # only works on 22 fails in the user's repository, not here.
      - name: Install Node 24 for the Action runtime check
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Record the Node 24 binary
        run: echo "DRIFT_NODE24=$(which node)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing needs an npm CLI new enough to mint and send
      # the OIDC token; do not rely on whatever a given runner image happens
      # to ship.
      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@11

      # ---- Validation phase: nothing here publishes anything. ----

      - run: npm ci

      # The tag just pushed must exactly match every manifest's version, and
      # every manifest must match each other, before a single further step
      # runs. This is deliberately the first thing after `npm ci`: a mismatch
      # here is a maintainer error, not a code regression, and should fail in
      # seconds, not after the full validation phase.
      - name: Validate release tag and version consistency
        run: node scripts/check-release-version.mjs --tag "${{ github.ref_name }}"

      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:review:validate
      - run: npm run eval:test
      - run: npm run eval:deterministic

      # Rebuilds action/index.cjs, fails if the committed bundle is stale,
      # runs it with node_modules removed, and confirms the optional
      # Anthropic SDK is statically bundled — the same check ci.yml runs on
      # every PR, invoked here through the same script so the two cannot
      # drift apart.
      - name: Verify the Action bundle (rebuild, staleness, self-containment, bundled SDK, Node 24)
        run: npm run verify:action-bundle

      # Identity strings, invented CLI commands, invented extension identifiers,
      # and any wording that sells an unchecked result as a pass. The README
      # advertised a `drift.pullRequest` command that never existed; a comment
      # could not have caught that, so this does.
      - name: Verify the READMEs and docs against the code
        run: npm run check:docs

      # The shipped workflow's trigger paths are generated from the manifest
      # registry; a stale committed copy means the Action silently stops
      # starting on files Drift supports.
      - name: Verify the example workflow matches the manifest registry
        run: npm run verify:workflow

      # The site is a release artifact too. It was outside every gate, which is
      # how it kept advertising a command that had been deleted.
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Extension — install, typecheck, test, build, package
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run package

      # Packs the real npm tarball, installs it into a clean temp directory,
      # and runs `drift --version`, `--help`, and the offline `analyze`/`fix`/
      # `pr` error paths against it — the actual artifact a user installs,
      # not source-tree imports. Uses its own throwaway `npm pack`; the
      # publish step below packs again for the real publish.
      - name: Smoke-test the packed CLI artifact
        run: npm run smoke:packed-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ---- Everything above must pass before anything below runs. ----
      # ---- Publish phase: each step here is a public, irreversible action. ----

      # No NODE_AUTH_TOKEN / NPM_TOKEN: npm Trusted Publishing authenticates
      # this exact workflow via the OIDC token id-token: write lets it mint,
      # and provenance is attached automatically — no --provenance flag
      # needed. Trusted Publishing for @usedrift/cli must already be
      # configured on npmjs.com (see docs/deployment.md); it cannot be set up
      # by this workflow.
      - name: Publish CLI to npm
        run: npm publish --access public

      # No VSCE_PAT: --oidc authenticates via the same GitHub Actions OIDC
      # token, which the `drift` Marketplace publisher must already trust
      # (see docs/deployment.md). Publishes the exact VSIX validation just
      # produced, not a fresh source build.
      - name: Publish extension to the VS Code Marketplace
        working-directory: extension
        run: npx --yes @vscode/vsce publish --oidc --no-dependencies --packagePath drift.vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            extension/drift.vsix

      - name: Move the floating v0 tag
        run: |
          MAJOR="$(echo "${{ github.ref_name }}" | sed -E 's/^v([0-9]+)\..*/v\1/')"
          if [ "$MAJOR" = "v0" ]; then
            git tag -f v0 "${{ github.ref_name }}"
            git push -f origin v0
          fi