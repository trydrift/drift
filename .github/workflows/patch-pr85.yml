              'src/util/diagnostics.ts',
              """interface Header {
  runId: string;
  command: string;
  mode: string;
""",
              """interface Header {
  runId: string;
  command: string;
  type?: string;
  mode: string;
""",
          )
          replace_once(
              'src/util/diagnostics.ts',
              """class RunState {
  readonly startedAtMs = Date.now();
""",
