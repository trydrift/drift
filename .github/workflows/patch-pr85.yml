          ref: feat/persist-typed-diagnostic-logs
          fetch-depth: 0

      - name: Apply guarded feature port
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Keep PR #86's diagnostics payload/rendering intact; change only artifact identity/lifecycle.
          replace_once(
              'src/util/diagnostics.ts',
              """ * A single always-on, repo-local diagnostic run log.
""",
              """ * Always-on, repo-local diagnostic run logging.
""",
